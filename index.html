<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script defer src="./script.js"></script>
    <title>Movie log</title>
</head>
<body>
    <h1>Movie log</h1>
    <form id="movieForm">
        <label for="title">Title</label>
        <input type="text" id="title">

        <label for="director">Director</label>
        <input type="text" id="director">

        <label for="reveiw">Reveiw</label>
        <textarea id="review"></textarea>

        <label for="rating">Rating (1-10)</label>
        <input type="text" id="rating">

        <button id="addMovie" type="submit">Add movie</button>
    </form>

    <p id="error"></p>
    <button id="listBtn">Show all movies</button>
    <button id="removeLastBtn">Remove last</button>
    <button id="titlesBtn">Show titles</button>
    <button id="clearBtn">Clear all</button>

    <h2>Movies</h2>
    <ol id="movieList"></ol>
    <p id="average"></p>
</body>
</html>
